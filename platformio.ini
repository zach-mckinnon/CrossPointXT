[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.3.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  h2zero/NimBLE-Arduino

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG


; Heltec Vision Master E213 V1.1 / ESP32-S3.
; Initial bring-up is intentionally isolated from the X3/X4 SDK-based app.
; The first target supports TXT reading and verifies the exact physical
; GPIO mapping. CrossPointXT EPUB/editor integration follows afterward.
[env:heltec_e213]
extends = base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 115200
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM=1
  -DHELTEC_E213_V11=1
  -std=gnu++17
build_unflags =
  -std=gnu++11
; Match Meshtastic's known E213 panel driver revision.
lib_deps =
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
  adafruit/Adafruit GFX Library @ ^1.12.0
; Do not compile the ESP32-C3 Xteink sources on this board yet.
build_src_filter =
  -<*>
  +<targets/heltec_e213/main.cpp>
; Omit old C3-specific codegen/patch scripts for the independent bring-up.
extra_scripts =


; Heltec E213 writer test target.
; This intentionally skips microSD and the full CrossPointXT HAL so the
; physical e-ink + BLE keyboard + internal-flash writing loop can be tested
; before the larger port is attempted.
[env:heltec_e213_writer]
extends = base
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
upload_speed = 115200
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM=1
  -DHELTEC_E213_V11=1
  -DVision_Master_E213
  -std=gnu++17
build_unflags =
  -std=gnu++11
lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git
  h2zero/NimBLE-Arduino
build_src_filter =
  -<*>
  +<targets/heltec_e213_writer/**>
extra_scripts =


; Minimal E213 V1.1 boot/display diagnostic. No BLE, filesystem, or SD.
[env:heltec_e213_diag]
platform = ${base.platform}
framework = arduino
board = heltec_wifi_lora_32_V3
monitor_speed = 115200
upload_speed = 115200
board_upload.use_1200bps_touch = true
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DVision_Master_E213
  -DHELTEC_E213_V11=1
  -std=gnu++17
build_unflags =
  -std=gnu++11
lib_deps =
  https://github.com/todd-herbert/heltec-eink-modules.git
build_src_filter =
  -<*>
  +<targets/heltec_e213_diag/**>
extra_scripts =
